<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buda Collective Artist</title>
    <!-- Keep original typography and styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base styles strictly from original welcome.html */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Original Canvas & Background Particles */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Container & Layout */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Hero Content - EXACT ORIGINAL TEXT & BUTTONS */
        .hero-section {
            text-align: center;
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 20;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.125rem;
            color: #A1A1AA;
            line-height: 1.6;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .cta-button {
            display: inline-block;
            padding: 14px 32px;
            background: #FFFFFF;
            color: #000000;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 9999px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
        }

        /* ==========================================================================
           FLOATING CARDS LAYER (ONLY FX MODIFICATION - EXACT ORIGINAL PLACEMENT)
           ========================================================================== */

        /* Floating Cards Floating FX - CSS Animations */
        .floating-card {
            position: absolute;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px 24px;
            color: #ffffff;
            z-index: 15;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.1s ease-out;
            will-change: transform;
            cursor: pointer;
        }

        .floating-card:hover {
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.05);
        }

        /* Specific positions for the 3 original cards in the grid */
        .card-1 {
            top: 15%;
            left: 10%;
            animation: fc-float-1 12s ease-in-out infinite;
        }

        .card-2 {
            top: 18%;
            right: 10%;
            animation: fc-float-2 9s ease-in-out infinite;
        }

        .card-3 {
            bottom: 18%;
            left: 12%;
            animation: fc-float-3 11s ease-in-out infinite;
        }

        /* Organic Floating Loops */
        @keyframes fc-float-1 {
            0%, 100% { transform: translate3d(0, 0px, 0) rotate(0deg); }
            50% { transform: translate3d(0, 8px, 0) rotate(1deg); }
        }

        @keyframes fc-float-2 {
            0%, 100% { transform: translate3d(0, 0px, 0) rotate(0deg); }
            50% { transform: translate3d(0, -6px, 0) rotate(-1.5deg); }
        }

        @keyframes fc-float-3 {
            0%, 100% { transform: translate3d(0, 0px, 0) rotate(0deg); }
            50% { transform: translate3d(0, 5px, 0) rotate(1deg); }
        }

        /* Card Content Styling */
        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .card-desc {
            font-size: 0.8rem;
            color: #71717A;
            line-height: 1.4;
        }

        /* Responsive adjustment */
        @media (max-width: 768px) {
            .hero-title { font-size: 2.2rem; }
            .floating-card {
                position: relative;
                top: auto !important;
                left: auto !important;
                right: auto !important;
                bottom: auto !important;
                margin: 10px 0;
                animation: none !important;
                width: 100%;
                max-width: 320px;
            }
            .main-container {
                flex-direction: column;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Original Background Canvas Particles -->
    <canvas id="particles-canvas"></canvas>

    <div class="main-container">

        <!-- Card 1 (Original position with floating FX) -->
        <div class="floating-card card-1" data-parallax="0.06">
            <div class="card-title">Founder</div>
            <div class="card-desc">Buda Collective Studio</div>
        </div>

        <!-- Card 2 (Original position with floating FX) -->
        <div class="floating-card card-2" data-parallax="0.04">
            <div class="card-title">Artist</div>
            <div class="card-desc">Digital & 3D Visuals</div>
        </div>

        <!-- Hero Content Section (EXACT SAME ORIGINAL CONTENT) -->
        <div class="hero-section">
            <h1 class="hero-title">WELCOME</h1>
            <p class="hero-subtitle">Buda Collective Artist Studio & Ecosystem</p>
            <a href="#" class="cta-button">Enter Studio</a>
        </div>

        <!-- Card 3 (Original position with floating FX) -->
        <div class="floating-card card-3" data-parallax="0.05">
            <div class="card-title">Project</div>
            <div class="card-desc">Curated Collections</div>
        </div>

    </div>

    <!-- Original Canvas Particles Script -->
    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.alpha = Math.random() * 0.6 + 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) {
            particles.push(new Particle());
        }

        function renderParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(renderParticles);
        }

        renderParticles();
    </script>

    <!-- Parallax Smooth Interaction Script (JS nuevo: Floating Cards Interaction) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.floating-card');
            let mouseX = 0, mouseY = 0;
            let targetX = 0, targetY = 0;

            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth / 2);
                mouseY = (e.clientY - window.innerHeight / 2);
            });

            function animateParallax() {
                targetX += (mouseX - targetX) * 0.05;
                targetY += (mouseY - targetY) * 0.05;

                cards.forEach(card => {
                    const depth = parseFloat(card.getAttribute('data-parallax')) || 0.05;
                    const offsetX = targetX * depth;
                    const offsetY = targetY * depth;
                    card.style.transform = `translate3d(${offsetX}px, ${offsetY}px, 0)`;
                });

                requestAnimationFrame(animateParallax);
            }

            animateParallax();
        });
    </script>

</body>
</html>
